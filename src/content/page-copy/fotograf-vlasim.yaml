seoDescription: "Fotograf a tvůrce videí ve Vlašimi, Benešově a okolí Středočeského kraje."
eyebrow: "Lokální služba"
heading: "Fotograf a tvůrce videí Vlašim a okolí"
lead: "Fotografie i video pro firmy, developery, obce, akce a architektonické projekty ve Vlašimi, Benešově, Středočeském kraji a okolí. Lze domluvit reportážní natáčení, fotky interiérů, firemní obsah i letecké záběry."
summary: "Základní oblast působení je Vlašim a Benešov se Středočeským krajem. Druhotně realizace nabízím na Vysočině a v Jižních Čechách. Cestovní podmínky a případné doplatky domlouvám předem podle vzdálenosti a rozsahu."
