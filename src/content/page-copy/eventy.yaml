heading: "Foto a video z firemních, kulturních a sportovních akcí"
lead: "Zachycuji firemní večírky, konference, kulturní i sportovní akce. Výstupem jsou reportážní fotky a případně krátké či delší video použitelné pro interní i veřejnou komunikaci."
summary: "Před akcí stanovíme hlavní momenty, důležité osoby, časový harmonogram i požadované formáty. Přístupy k místu i souhlas účastníků ověřujeme předem, takže focení nezasahuje do programu."
