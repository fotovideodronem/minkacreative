heading: "Stavební fotoreporty"
lead: "Průběžně dokumentuji postup staveb pro stavební firmy a developery. Fotografie zachycují celkový stav projektu i důležité detaily v jednotlivých etapách."
summary: "Rozsah a četnost fotoreportů se domlouvají podle harmonogramu stavby a účelu dokumentace. Výstup může sloužit k internímu přehledu o postupu, archivaci projektu i jeho prezentaci. Působím ve Vlašimi, Benešově, Středočeském kraji a po dohodě také v dalších oblastech."
