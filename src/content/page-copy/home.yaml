summaryText: "[DOPLNIT: Souhrn na 50 až 80 slov, který přímo odpovídá na otázky: kdo (Jakub Minka / Minka Creative), co (foto, video, dron), pro koho (firmy, stavební firmy a developeři, realitky a architekti, obce, akce a maturitní plesy), kde (Vlašim, Benešov, Středočeský kraj, Praha) a orientační cena od.]"
