eyebrow: "Interiéry a architektura"
heading: "Focení interiérů, exteriérů a architektury"
lead: "Fotím interiéry, nemovitosti, exteriéry i architektonické projekty pro realitky, architekty, developery a vlastníky. Záběry zachycují prostor, světlo, materiály i použití budovy."
summary: "Před fotografováním nastavím úhel, pořadí místností a požadovaný počet snímků. Fotky lze připravit s přírodní nebo kontrolovanou světelnou situací a upravit pro inzertní portály, weby i publikace."
