seoTitle: "Letecké záběry dronem | Minka Creative"
seoDescription: "Letecké fotografie a video ze staveb, areálů, obcí a krajiny."
eyebrow: "Dron"
heading: "Letecké záběry ze staveb, areálů a míst"
lead: "Dronem pořizujeme letecké fotografie i video dokumentující stavbu, areál, krajinu nebo akci. Výsledné materiály jsou vhodné pro prezentaci, archiv i průběžnou reportáž."
summary: "Bezpečnost a povolení letu jsou součástí přípravy. Podle prostoru, větrných podmínek a účelu zvolíme vhodnou trasu a konečný pohled. Přímé lety nad lidmi ani mimo sjednané podmínky nepodstupujeme."
