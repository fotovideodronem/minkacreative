seoTitle: "Foto a video pro obce, města a turismus | Minka Creative"
seoDescription: "Fotografie a videa míst, veřejných akcí, projektů a turistických destinací."
eyebrow: "Obce, města a turismus"
heading: "Prezentační foto a video pro obce a turistická centra"
lead: "Pomohu obcím, městům a turistickým organizacím vytvořit materiály o místech, akcích, projektech a dostupných službách. Fotky i krátká videa lze použít na webu, v tisku i na sociálních sítích."
summary: "Společně určujeme hlavní zprávu: prezentaci destinace, informování obyvatel, propagaci akce nebo dokumentaci investice. Pracujeme s veřejnými prostory i místními provozovateli, aby vznikla autentická a prakticky použitelná sada materiálů."
