eyebrow: "Maturitní plesy"
heading: "Fotografie a video z maturitních plesů"
lead: "Zaznamenávám atmosféru maturitních plesů, důležité okamžiky programu i společné fotografie. Výstupy připravím pro maturanty, školu i propagaci dalšího ročníku."
summary: "Před plesem dohodneme harmonogram slavnostních momentů, místo skupinových fotek, délku natáčení i způsob předání. U citlivých snímků dětí a mladých dospělých ověřujeme souhlas a oprávnění ke zveřejnění."
