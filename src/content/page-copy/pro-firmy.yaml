eyebrow: "Pro firmy a značky"
heading: "Foto a video pro firmy, které chcete ukázat kvalitně"
lead: "Pomohu firmám vytvořit vizuální materiál pro web, prezentace, tisk i sociální sítě. Zaměřuji se na výrobní prostředí, lidi, produkty a konkrétní příběh firmy."
summary: "Před natáčením upřesníme účel materiálů, cílovou skupinu, počet výstupů a požadovaný styl. Vhodně spojíme celkové pohledy, detaily a reálný průběh práce, aby výsledky odpovídaly tomu, jak firma skutečně funguje."
